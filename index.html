<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokratik Mühendislik Öğrenme Asistanı</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--primary);
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .chat-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 120px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .report-card {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- EKRAN 1: İhtiyaç ve Hedef Belirleme -->
    <div id="screen1" class="screen active">
      <div class="header">
        <h2>Adım 1: Hedef ve Konu Seçimi</h2>
      </div>
      <label for="topic">Öğrenmek / Geliştirmek İstediğiniz Konu:</label>
      <select id="topic">
        <option value="Mikroişlemciler ve Embedded Sistemler">Mikroişlemciler ve Embedded Sistemler</option>
        <option value="Python ve Arayüz Geliştirme">Python ve Arayüz Geliştirme</option>
        <option value="Sinyal ve Sistem Analizi">Sinyal ve Sistem Analizi</option>
      </select>

      <label for="level">Mevcut Bilgi Seviyeniz:</label>
      <select id="level">
        <option value="Başlangıç">Başlangıç</option>
        <option value="Orta Seviye">Orta Seviye</option>
        <option value="İleri Seviye">İleri Seviye</option>
      </select>

      <button onclick="goToScreen2()">Öğrenmeye Başla</button>
    </div>

    <!-- EKRAN 2: Sokratik Etkileşim ve Düşündürme -->
    <div id="screen2" class="screen">
      <div class="header">
        <h2>Adım 2: Sokratik Sorgulama</h2>
      </div>
      <div class="chat-box" id="socraticQuestion">
        <!-- JS ile soru buraya yüklenecek -->
      </div>
      <label for="userAnswer">Düşünceniz / Cevabınız:</label>
      <textarea id="userAnswer" rows="3" placeholder="Doğrudan cevabı aramak yerine nasıl bir yaklaşım izlersiniz?"></textarea>

      <button onclick="goToScreen3()">Analizi Tamamla ve Raporla</button>
    </div>

    <!-- EKRAN 3: Yol Haritası ve Gelişim Raporu -->
    <div id="screen3" class="screen">
      <div class="header">
        <h2>Adım 3: Öğrenme Yol Haritası</h2>
      </div>
      <div class="report-card">
        <p><strong>Seçilen Konu:</strong> <span id="summaryTopic"></span></p>
        <p><strong>Seviye:</strong> <span id="summaryLevel"></span></p>
      </div>
      <h4>Sokratik Analiz Özeti:</h4>
      <p id="summaryFeedback" style="font-size: 0.9rem; color: #374151;"></p>
      
      <button onclick="restartApp()" style="background-color: #4b5563;">Baştan Başla</button>
    </div>

  </div>

  <script>
    let selectedTopic = "";
    let selectedLevel = "";

    function goToScreen2() {
      selectedTopic = document.getElementById("topic").value;
      selectedLevel = document.getElementById("level").value;

      let questionText = "";
      if(selectedTopic.includes("Mikroişlemciler")) {
        questionText = "💡 *Sokratik Soru:* Bir mikroişlemcide kesme (interrupt) mekanizması olmasaydı, sürekli işlemciyi meşgul eden 'polling' (sorgulama) yöntemi sistem performansını nasıl etkilerdi?";
      } else if(selectedTopic.includes("Python")) {
        questionText = "💡 *Sokratik Soru:* Grafik arayüzde (GUI) ana döngüyü (main loop) bloke eden uzun bir işlem çalıştırdığınızda arayüz neden donar? Bunu engellemek için nasıl bir mantık kurulabilir?";
      } else {
        questionText = "💡 *Sokratik Soru:* Bir sinyalin zaman ortamındaki gösterimi ile frekans ortamındaki gösterimi arasındaki temel fark nedir ve Fourier dönüşümü bize burada nasıl bir bakış açısı kazandırır?";
      }

      document.getElementById("socraticQuestion").innerHTML = questionText;
      document.getElementById("screen1").classList.remove("active");
      document.getElementById("screen2").classList.add("active");
    }

    function goToScreen3() {
      let answer = document.getElementById("userAnswer").value;
      
      document.getElementById("summaryTopic").innerText = selectedTopic;
      document.getElementById("summaryLevel").innerText = selectedLevel;

      let feedback = "";
      if (answer.trim().length < 10) {
        feedback = "Cevabınız çok kısa. Sokratik yöntem derinlemesine düşünmeyi teşvik eder. Konuyla ilgili teknik dokümantasyonları ve temel kavramları tekrar gözden geçirmeniz önerilir.";
      } else {
        feedback = "Yaklaşımınız analiz edildi. Sorunu doğrudan ezberlemek yerine mantığını sorgulama eğiliminiz yüksek. Konuyla ilgili pratik projeler üreterek kavramsal bilginizi pekiştirebilirsiniz.";
      }

      document.getElementById("summaryFeedback").innerText = feedback;
      document.getElementById("screen2").classList.remove("active");
      document.getElementById("screen3").classList.add("active");
    }

    function restartApp() {
      document.getElementById("userAnswer").value = "";
      document.getElementById("screen3").classList.remove("active");
      document.getElementById("screen1").classList.add("active");
    }
  </script>
</body>
</html>
